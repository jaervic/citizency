<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a3a6b" />
    <meta
      name="description"
      content="Prepárate para el examen de ciudadanía de los Estados Unidos (USCIS 2025): flashcards, examen de práctica, simulacro de entrevista y progreso. Todo funciona en tu navegador."
    />
    <script>
      // El tema se aplica ANTES del primer pintado para que no se vea un destello del tema
      // equivocado. Lee la preferencia guardada por Zustand ('system' si no hay nada o si el
      // almacenamiento está bloqueado) y, si es 'system', pregunta al sistema operativo.
      (function () {
        var preference = 'system';

        try {
          var saved = window.localStorage.getItem('userProgress');
          if (saved !== null) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.state && typeof parsed.state.theme === 'string') {
              preference = parsed.state.theme;
            }
          }
        } catch (error) {
          preference = 'system';
        }

        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);

        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;

        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta !== null) {
          meta.setAttribute('content', theme === 'dark' ? '#16233c' : '#1a3a6b');
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="USCIS Ciudadanía" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>USCIS Ciudadanía — Prepara tu examen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
